# ── FracAtlas body_part → region_id mapping ──────────────────────────────────
# Source for mapping decisions: FracAtlas dataset README (CC0);
#   https://github.com/mahfuzalhasan/FracAtlas
# Evidence: the dataset labels "hand", "leg", "hip", "other" refer to the
# general anatomical region of the X-ray, not a specific bone.
# "hand" encompasses distal radius, ulna, carpal and metacarpal bones.
# "leg" encompasses femur, tibia, fibula — the dataset does not separate them.
# "hip" encompasses pelvis and proximal femur.
# "other" is ambiguous; it receives region_uncertain status.
# review_status: draft

fracatlas_body_part_to_region:
  hand:
    region_id: hand_wrist
    source: "FracAtlas README; PA / AP radiograph coverage of wrist and hand"
    review_status: draft
  leg:
    region_id: leg_lower        # majority of FracAtlas leg images show tibia/fibula
    source: >
      FracAtlas dataset; visual inspection of leg subset shows predominantly
      tibia/fibula images. Femur images are a minority but not separable from
      the label alone. Conservative mapping to lower leg; leg_lower is used
      as primary. Clinician review required.
    review_status: draft
  hip:
    region_id: pelvis_hip
    source: "FracAtlas README; hip images show pelvis and proximal femur"
    review_status: draft
  other:
    region_id: null             # → region_uncertain
    source: "FracAtlas 'other' category is heterogeneous; no safe mapping"
    review_status: draft

# ── Knee dataset → region_id mapping ─────────────────────────────────────────
knee_to_region:
  osteoporosis:
    region_id: knee
    source: "Knee Osteoporosis dataset (Kaggle CC0); images are of the knee joint"
    review_status: draft
  normal:
    region_id: knee
    source: "Knee Osteoporosis dataset (Kaggle CC0)"
    review_status: draft

# ── Chest finding → skeleton highlight target ─────────────────────────────────
# type: "organ_zone"  → rendered as translucent volume on the ribcage region
# type: "bone_region" → rendered as highlighted mesh on the named bone
# severity_source: always "finding_probability" for chest findings
# region_id keys map to the lungseg zone names produced by Step 8.
# The lungseg zones are: right_upper, right_mid, right_lower,
#                        left_upper, left_mid, left_lower
# "bilateral" findings highlight both lungs; cardiac highlights heart_mediastinum.
# Source for zone assignments: standard radiological teaching conventions;
#   Felson & White, "Fundamentals of Chest Radiology", Saunders, 1999 (ISBN 978-0721670614)
# review_status: draft for all entries

chest_finding_to_target:
  Atelectasis:
    region_id: lung_right_lower   # most common lower-zone collapse; bilateral in principle
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Lobar/segmental atelectasis; bilateral coverage; lower zones predominate"
    source: "Felson & White 1999 ch.6; NIH ChestX-ray14 label"
    review_status: draft

  Cardiomegaly:
    region_id: heart_mediastinum
    bilateral: false
    type: organ_zone
    severity_source: finding_probability
    note: "Cardiac silhouette enlargement; mediastinum highlight"
    source: "Felson & White 1999 ch.9"
    review_status: draft

  Effusion:
    region_id: lung_right_lower
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Pleural effusion; lower zones; bilateral possible"
    source: "Felson & White 1999 ch.8"
    review_status: draft

  Infiltration:
    region_id: lung_right_lower
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Airspace infiltration; lower lobes predominant"
    source: "Felson & White 1999 ch.5"
    review_status: draft

  Mass:
    region_id: lung_right_upper
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Pulmonary mass; zone determined by heatmap peak in practice"
    source: "Felson & White 1999 ch.7"
    review_status: draft

  Nodule:
    region_id: lung_right_upper
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Pulmonary nodule"
    source: "Felson & White 1999 ch.7"
    review_status: draft

  Pneumonia:
    region_id: lung_right_lower
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Pneumonic consolidation; lower lobes predominant"
    source: "Felson & White 1999 ch.5"
    review_status: draft

  Pneumothorax:
    region_id: lung_right_upper
    bilateral: false
    type: organ_zone
    severity_source: finding_probability
    note: "Air in pleural space; apex first"
    source: "Felson & White 1999 ch.8"
    review_status: draft

  Consolidation:
    region_id: lung_right_lower
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Airspace consolidation; lower lobes predominant"
    source: "Felson & White 1999 ch.5"
    review_status: draft

  Edema:
    region_id: lung_right_lower
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Pulmonary oedema; perihilar to lower zones"
    source: "Felson & White 1999 ch.10"
    review_status: draft

  Emphysema:
    region_id: lung_right_upper
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Hyperinflation and bullae; upper lobe predominant"
    source: "Felson & White 1999 ch.6"
    review_status: draft

  Fibrosis:
    region_id: lung_right_lower
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Pulmonary fibrosis; lower lobe basilar predominant"
    source: "Felson & White 1999 ch.5"
    review_status: draft

  Pleural_Thickening:
    region_id: lung_right_lower
    bilateral: true
    type: organ_zone
    severity_source: finding_probability
    note: "Pleural thickening; costophrenic angles and bases"
    source: "Felson & White 1999 ch.8"
    review_status: draft

  Hernia:
    region_id: heart_mediastinum
    bilateral: false
    type: organ_zone
    severity_source: finding_probability
    note: "Hiatal hernia visible in mediastinum/retrocardiac area"
    source: "Felson & White 1999 ch.9"
    review_status: draft

# ── Step 8 lungseg zone → region_id mapping ──────────────────────────────────
# The lungseg service (backend/app/services/lungseg/lungseg.py) returns zone
# names of the form "{side}_{position}": e.g. "right_upper".
# Source: Step 8 implementation; review_status: draft.
lungseg_zone_to_region:
  right_upper: lung_right_upper
  right_mid:   lung_right_mid
  right_lower: lung_right_lower
  left_upper:  lung_left_upper
  left_mid:    lung_left_mid
  left_lower:  lung_left_lower
