model:
  backbone: "mobilenet_v3_small"
  pretrained: true
  num_classes: 3  # 0: xray, 1: mri, 2: natural

data:
  manifest: "data/processed/gate_manifest.csv"
  image_size: 224

training:
  batch_size: 64
  epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 0   # Windows multiprocessing avoidance
  amp_dtype: "bfloat16"

checkpoint:
  dir: "models/gate_classifier"
