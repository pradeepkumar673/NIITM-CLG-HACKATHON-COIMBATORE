[project]
name = "xray-assistant"
version = "0.1.0"
description = "AI X-ray decision-support assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "python-jose",
    "passlib[bcrypt]",
    "python-multipart",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "opencv-python-headless",
    "pillow",
    "pydicom",
    "grad-cam",
    "segmentation-models-pytorch",
    "timm",
    "pyyaml",
    "reportlab",
    "matplotlib",
    "pytest",
    "httpx",
    "ruff",
    "kaggle",
    "torch",
    "torchvision",
    "torchxrayvision>=1.5.5",
    "transformers>=5.19.0",
    "email-validator>=2.3.0",
    "groq>=1.7.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
# Only collect tests from the tests/ directory.
# scratch/ contains exploratory one-off scripts that are not test suites (R9).
testpaths = ["tests"]
# Make the project root available as a Python path so `import backend` works
# regardless of whether pytest is invoked via `pytest` or `python -m pytest`.
pythonpath = ["."]
