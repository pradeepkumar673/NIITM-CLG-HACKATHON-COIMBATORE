# config/anatomy.yaml
# ============================================================================
# Anatomy mapping for 3D skeleton visualisation.
#
# Canonical region/bone list source:
#   Terminologia Anatomica, 2nd edition (FCAT, 2019).
#   Identifier: FCAT-TA2-2019 (https://ta2viewer.openanatomy.org/)
#   review_status: draft  (pending clinician sign-off)
#
# All entries that carry a medical interpretation carry both:
#   source:        citable reference for the mapping decision
#   review_status: "draft" until a clinician co-signs this file
#
# R3 compliance: no constant may be hardcoded in product code; all come here.
# ============================================================================

meta:
  canonical_list_source: "Terminologia Anatomica, 2nd ed (FCAT 2019); https://ta2viewer.openanatomy.org/"
  canonical_list_id: "FCAT-TA2-2019"
  review_status: draft
  note: >
    This file is decision-support configuration. Every mapping is marked
    draft until reviewed and co-signed by a qualified radiologist or
    clinical anatomist.

# ── Accuracy gate ────────────────────────────────────────────────────────────
# If measured region-classification accuracy for a region falls below this
# threshold on the held-out TEST split, that region is returned as
# "region_uncertain" and the skeleton shows nothing red.
# Source: project design decision, conservative safety margin; review_status: draft.
min_region_accuracy: 0.60

# ── Skeleton regions ─────────────────────────────────────────────────────────
# Each entry is a skeletal region or anatomical zone usable by the frontend.
# Fields per entry:
#   id:            machine identifier (snake_case, stable across versions)
#   label_en:      English display label
#   label_ta:      Tamil display label (placeholder – requires translation review)
#   label_hi:      Hindi display label (placeholder – requires translation review)
#   ta2_term:      Terminologia Anatomica 2 preferred term (if mapped)
#   ta2_id:        TA2 entity ID (if available)
#   parent:        id of the parent region (null for roots)
#   type:          "bone_region" | "organ_zone"
#   source:        evidence for this entry
#   review_status: "draft"

regions:
  # ── Upper limb ──────────────────────────────────────────────────────────
  - id: hand_wrist
    label_en: "Hand / Wrist"
    label_ta: "கை / மணிக்கட்டு"
    label_hi: "हाथ / कलाई"
    ta2_term: "Manus / Carpus"
    ta2_id: "A02.4"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.4; FracAtlas body_part=hand"
    review_status: draft

  - id: forearm
    label_en: "Forearm (Radius / Ulna)"
    label_ta: "முன்னங்கை"
    label_hi: "अग्रभुजा"
    ta2_term: "Antebrachium"
    ta2_id: "A02.4.2"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.4.2"
    review_status: draft

  - id: upper_arm
    label_en: "Upper Arm (Humerus)"
    label_ta: "மேல் கை"
    label_hi: "ऊपरी बांह"
    ta2_term: "Brachium"
    ta2_id: "A02.4.1"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.4.1"
    review_status: draft

  # ── Lower limb ──────────────────────────────────────────────────────────
  - id: leg_lower
    label_en: "Lower Leg (Tibia / Fibula)"
    label_ta: "கீழ் கால்"
    label_hi: "निचली टांग"
    ta2_term: "Crus"
    ta2_id: "A02.5.3"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.5.3; FracAtlas body_part=leg"
    review_status: draft

  - id: thigh
    label_en: "Thigh (Femur)"
    label_ta: "தொடை"
    label_hi: "जांघ"
    ta2_term: "Femur"
    ta2_id: "A02.5.2"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.5.2; FracAtlas body_part=leg"
    review_status: draft

  - id: foot_ankle
    label_en: "Foot / Ankle"
    label_ta: "பாதம் / கணுக்கால்"
    label_hi: "पैर / टखना"
    ta2_term: "Pes / Tarsus"
    ta2_id: "A02.5.4"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.5.4"
    review_status: draft

  # ── Pelvis / Hip ─────────────────────────────────────────────────────────
  - id: pelvis_hip
    label_en: "Pelvis / Hip"
    label_ta: "இடுப்பு"
    label_hi: "श्रोणि / कूल्हा"
    ta2_term: "Pelvis / Coxa"
    ta2_id: "A02.5.1"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.5.1; FracAtlas body_part=hip"
    review_status: draft

  # ── Knee ─────────────────────────────────────────────────────────────────
  - id: knee
    label_en: "Knee (Patella / Condyles)"
    label_ta: "முழங்கால்"
    label_hi: "घुटना"
    ta2_term: "Articulatio genus"
    ta2_id: "A03.6.1"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A03.6.1; Knee Osteoporosis dataset"
    review_status: draft

  # ── Thorax / Chest ───────────────────────────────────────────────────────
  - id: ribs_sternum
    label_en: "Ribs / Sternum"
    label_ta: "விலா எலும்புகள் / மார்பெலும்பு"
    label_hi: "पसलियाँ / उरोस्थि"
    ta2_term: "Costae / Sternum"
    ta2_id: "A02.3"
    parent: null
    type: bone_region
    source: "FCAT-TA2-2019 A02.3"
    review_status: draft

  - id: spine_thoracic
    label_en: "Thoracic Spine"
    label_ta: "மார்பு முதுகெலும்பு"
    label_hi: "वक्षीय रीढ़"
    ta2_term: "Vertebrae thoracicae"
