targets:
  chest_mean_auroc:
    value: 0.85
    rationale: "Requires high reliability for screening chest X-rays. 0.85 is a minimal clinical utility threshold."
  ece_calibration_improvement:
    value: true
    rationale: "ECE after calibration must be strictly lower than before to ensure trustworthy probability outputs."
  tier_ppv_meets_target:
    value: 10
    rationale: "At least 10 out of 14 labels should meet their PPV targets for High tier."
  ood_detection_rate:
    value: 0.95
    rationale: "System must confidently reject out-of-distribution images like MRI or natural photos to ensure safe use."
  lung_dice:
    value: 0.90
    rationale: "Accurate lung boundaries (>0.90 Dice) are critical for bounding box explainability and accurate anatomy targeting."
  fracture_auroc:
    value: 0.85
    rationale: "Reliable fracture detection is necessary for the emergency room workflow triage."
  registration_error_px:
    value: 10.0
    rationale: "Longitudinal comparison relies on alignment; error must be unnoticeable (<10 pixels on average)."
  gate_rejection_rate:
    value: 0.95
    rationale: "Gate must reject real negatives (wrong body parts) accurately to prevent downstream failures."
  p95_latency_ms:
    value: 5000.0
    rationale: "Interactive turnaround requires end-to-end processing within 5 seconds for acceptable user experience."
